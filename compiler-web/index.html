<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PotterLang Web IDE</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/editor/editor.main.min.css">
  <script src="https://cdn.jsdelivr.net/pyodide/v0.26.1/full/pyodide.js"></script>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; height: 100vh; display: flex; flex-direction: column; background: #121217; color: #e4e4e7; overflow: hidden; }
    
    header { height: 48px; background: #18181f; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid #272730; }
    .logo { font-size: 15px; font-weight: 600; letter-spacing: 0.5px; color: #f4f4f5; display: flex; align-items: center; gap: 8px; }
    .badge { background: #272730; color: #a1a1aa; font-size: 11px; padding: 2px 6px; border-radius: 4px; }
    .controls { display: flex; gap: 10px; align-items: center; }
    
    select { background: #22222a; color: #d4d4d8; border: 1px solid #32323f; padding: 6px 12px; border-radius: 4px; font-size: 12px; outline: none; cursor: pointer; }
    select:focus { border-color: #3b82f6; }
    
    .btn-run { background: #2563eb; color: #fff; border: none; padding: 6px 18px; border-radius: 4px; font-weight: 600; font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: background 0.15s; }
    .btn-run:hover { background: #1d4ed8; }
    .btn-run:disabled { background: #3f3f46; cursor: not-allowed; }

    .btn-clear { background: transparent; color: #a1a1aa; border: 1px solid #32323f; padding: 6px 12px; border-radius: 4px; font-size: 12px; cursor: pointer; }
    .btn-clear:hover { background: #22222a; color: #fff; }

    .workspace { display: flex; flex: 1; height: calc(100vh - 48px); }
    .editor-pane { flex: 1.2; height: 100%; border-right: 1px solid #272730; }
    .terminal-pane { flex: 0.8; height: 100%; display: flex; flex-direction: column; background: #0c0c0e; }
    
    .terminal-header { height: 36px; background: #141418; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; font-size: 11px; font-weight: 600; color: #71717a; border-bottom: 1px solid #272730; letter-spacing: 0.5px; }
    .status { font-size: 11px; color: #eab308; }
    
    .terminal-body { flex: 1; padding: 14px 16px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 13px; color: #f4f4f5; overflow-y: auto; white-space: pre-wrap; line-height: 1.5; cursor: text; }
    
    .active-prompt-line { display: flex; align-items: center; }
    .prompt-text { color: #60a5fa; }
    .term-input { background: transparent; border: none; outline: none; color: #facc15; font-family: inherit; font-size: inherit; flex: 1; margin-left: 6px; caret-color: #facc15; }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      PotterLang <span class="badge">v1.0.0</span>
    </div>
    <div class="controls">
      <select id="templateSelect" onchange="loadTemplate(this.value)">
        <option value="binary_search">Algorithm: Interactive Binary Search</option>
        <option value="bubble_sort">Algorithm: Bubble Sort</option>
        <option value="factorial">Algorithm: Factorial</option>
      </select>
      <button class="btn-clear" onclick="clearTerminal()">Clear</button>
      <button id="runBtn" class="btn-run" onclick="executeCode()" disabled>Run</button>
    </div>
  </header>

  <div class="workspace">
    <div id="editor" class="editor-pane"></div>
    <div class="terminal-pane">
      <div class="terminal-header">
        <span>TERMINAL</span>
        <span id="statusIndicator" class="status">Initializing WebAssembly engine...</span>
      </div>
      <div id="terminal" class="terminal-body" onclick="focusInput()">Loading WebAssembly engine...</div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>

  <script>
    const templates = {
      binary_search: `// Binary Search with real-time interactive input
Incantation binary_search(arr, target) {
    Accio low = 0
    Accio high = len(arr) - 1

    TimeTurner (low <= high) {
        Accio mid = floor((low + high) / 2)

        Riddikulus (arr[mid] == target) {
            ExpectoPatronum mid
        } Finite {
            Riddikulus (arr[mid] < target) {
                low = mid + 1
            } Finite {
                high = mid - 1
            }
        }
    }
    ExpectoPatronum -1
}

Accio size = Legilimens("Enter array size: ")
Accio numbers = []
Accio i = 0

TimeTurner (i < size) {
    Accio val = Legilimens("Enter sorted number at index " + i + ": ")
    push(numbers, val)
    i = i + 1
}

Lumos "Array elements: " + numbers

Accio target = Legilimens("Enter number to search: ")
Accio result = binary_search(numbers, target)

Riddikulus (result != -1) {
    Lumos "Target found at index: " + result
} Finite {
    Lumos "Target not found in array."
}`,

      bubble_sort: `// Bubble Sort Algorithm
Incantation bubble_sort(arr) {
    Accio n = len(arr)
    Accio i = 0
    TimeTurner (i < n) {
        Accio j = 0
        TimeTurner (j < n - i - 1) {
            Riddikulus (arr[j] > arr[j + 1]) {
                Accio temp = arr[j]
                arr[j] = arr[j + 1]
                arr[j + 1] = temp
            }
            j = j + 1
        }
        i = i + 1
    }
    ExpectoPatronum arr
}

Accio numbers = [64, 34, 25, 12, 22, 11, 90]
Lumos "Original:"
Lumos numbers

bubble_sort(numbers)

Lumos "Sorted:"
Lumos numbers`,

      factorial: `// Recursive Factorial
Incantation factorial(n) {
    Riddikulus (n <= 1) {
        ExpectoPatronum 1
    } Finite {
        ExpectoPatronum n * factorial(n - 1)
    }
}

Accio val = Legilimens("Enter number for factorial: ")
Lumos "Factorial of " + val + " is: " + factorial(val)`
    };

    let editorInstance;
    let pyodideInstance;

    require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs' } });
    require(['vs/editor/editor.main'], function () {
      monaco.languages.register({ id: 'potterlang' });
      monaco.languages.setMonarchTokensProvider('potterlang', {
        keywords: [
          'Accio', 'Lumos', 'Riddikulus', 'Finite', 'TimeTurner',
          'Incantation', 'ExpectoPatronum', 'Protego', 'Crucio',
          'AvadaKedavra', 'Legilimens', 'true', 'false'
        ],
        tokenizer: {
          root: [
            [/[a-zA-Z_]\w*/, { cases: { '@keywords': 'keyword', '@default': 'identifier' } }],
            [/\/\/.*$/, 'comment'],
            [/".*?"/, 'string'],
            [/\d+(\.\d+)?/, 'number'],
            [/[{}()\[\]]/, '@brackets'],
            [/[=><!&|+\-*/%]/, 'operator']
          ]
        }
      });

      monaco.editor.defineTheme('potterStudio', {
        base: 'vs-dark',
        inherit: true,
        rules: [
          { token: 'keyword', foreground: '60A5FA', fontStyle: 'bold' },
          { token: 'string', foreground: '34D399' },
          { token: 'comment', foreground: '52525B', fontStyle: 'italic' },
          { token: 'number', foreground: 'FBBF24' }
        ],
        colors: {
          'editor.background': '#121217',
          'editorLineNumber.foreground': '#3f3f46',
          'editorLineNumber.activeForeground': '#a1a1aa',
          'editor.lineHighlightBackground': '#181820'
        }
      });

      editorInstance = monaco.editor.create(document.getElementById('editor'), {
        value: templates.binary_search,
        language: 'potterlang',
        theme: 'potterStudio',
        automaticLayout: true,
        fontSize: 13,
        minimap: { enabled: false }
      });
    });

    async function initPyodideEngine() {
      try {
        pyodideInstance = await loadPyodide();

        await pyodideInstance.runPythonAsync(`
import sys, math, re, asyncio
from enum import Enum, auto
import js

class TokenType(Enum):
    ACCIO = auto(); LUMOS = auto(); RIDDIKULUS = auto(); FINITE = auto(); TIMETURNER = auto()
    AVADAKEDAVRA = auto(); INCANTATION = auto(); EXPECTOPATRONUM = auto(); LEGILIMENS = auto()
    PROTEGO = auto(); CRUCIO = auto(); IDENTIFIER = auto(); NUMBER = auto(); STRING = auto()
    BOOLEAN = auto(); ASSIGN = auto(); PLUS = auto(); MINUS = auto(); STAR = auto()
    SLASH = auto(); PERCENT = auto(); EQ = auto(); NEQ = auto(); GT = auto(); LT = auto()
    GTE = auto(); LTE = auto(); AND = auto(); OR = auto(); NOT = auto(); LPAREN = auto()
    RPAREN = auto(); LBRACE = auto(); RBRACE = auto(); LBRACKET = auto(); RBRACKET = auto()
    COMMA = auto(); EOF = auto()

class Token:
    def __init__(self, type_, value, line):
        self.type, self.value, self.line = type_, value, line

KEYWORDS = {
    "Accio": TokenType.ACCIO, "Lumos": TokenType.LUMOS, "Riddikulus": TokenType.RIDDIKULUS,
    "Finite": TokenType.FINITE, "TimeTurner": TokenType.TIMETURNER, "AvadaKedavra": TokenType.AVADAKEDAVRA,
    "Incantation": TokenType.INCANTATION, "ExpectoPatronum": TokenType.EXPECTOPATRONUM,
    "Legilimens": TokenType.LEGILIMENS, "Protego": TokenType.PROTEGO, "Crucio": TokenType.CRUCIO,
    "true": TokenType.BOOLEAN, "false": TokenType.BOOLEAN,
}

class Lexer:
    def __init__(self, source):
        self.source, self.tokens, self.line = source, [], 1

    def tokenize(self):
        token_specs = [
            ("COMMENT",    r"//[^\\n]*"),
            ("STRING",     r'"([^"\\\\]|\\\\.)*"'),
            ("NUMBER",     r"\\b\\d+(\\.\\d+)?\\b"),
            ("AND",        r"&&"), ("OR", r"\\|\\|"), ("GTE", r">="), ("LTE", r"<="),
            ("EQ",         r"=="), ("NEQ", r"!="), ("NOT", r"!"),
            ("IDENT",      r"\\b[a-zA-Z_][a-zA-Z0-9_]*\\b"),
            ("ASSIGN",     r"="), ("PLUS", r"\\+"), ("MINUS", r"-"), ("STAR", r"\\*"),
            ("SLASH",      r"/"), ("PERCENT", r"%"), ("GT", r">"), ("LT", r"<"),
            ("LPAREN",     r"\\("), ("RPAREN", r"\\)"), ("LBRACE", r"\\{"), ("RBRACE", r"\\}"),
            ("LBRACKET",   r"\\["), ("RBRACKET", r"\\]"), ("COMMA", r","),
            ("NEWLINE",    r"\\n"), ("SKIP", r"[ \\t\\r]+"), ("MISMATCH", r"."),
        ]
        tok_regex = "|".join(f"(?P<{pair[0]}>{pair[1]})" for pair in token_specs)
        for mo in re.finditer(tok_regex, self.source):
            kind, val = mo.lastgroup, mo.group()
            if kind == "NEWLINE": self.line += 1
            elif kind in ("SKIP", "COMMENT"): continue
            elif kind == "NUMBER": self.tokens.append(Token(TokenType.NUMBER, float(val) if '.' in val else int(val), self.line))
            elif kind == "STRING": self.tokens.append(Token(TokenType.STRING, val[1:-1], self.line))
            elif kind == "IDENT":
                tok_type = KEYWORDS.get(val, TokenType.IDENTIFIER)
                actual_val = True if val == "true" else False if val == "false" else val
                self.tokens.append(Token(tok_type, actual_val, self.line))
            elif kind == "MISMATCH": raise SyntaxError(f"Unexpected token '{val}' at line {self.line}")
            else: self.tokens.append(Token(TokenType[kind], val, self.line))
        self.tokens.append(Token(TokenType.EOF, None, self.line))
        return self.tokens

class ASTNode: pass
class ProgramNode(ASTNode):
    def __init__(self, statements): self.statements = statements
class VarDeclNode(ASTNode):
    def __init__(self, name, expr): self.name, self.expr = name, expr
class VarAssignNode(ASTNode):
    def __init__(self, name, expr): self.name, self.expr = name, expr
class IndexAssignNode(ASTNode):
    def __init__(self, target, index, expr): self.target, self.index, self.expr = target, index, expr
class PrintNode(ASTNode):
    def __init__(self, expr): self.expr = expr
class IfNode(ASTNode):
    def __init__(self, condition, then_branch, else_branch=None):
        self.condition, self.then_branch, self.else_branch = condition, then_branch, else_branch
class WhileNode(ASTNode):
    def __init__(self, condition, body): self.condition, self.body = condition, body
class BlockNode(ASTNode):
    def __init__(self, statements): self.statements = statements
class FunctionDefNode(ASTNode):
    def __init__(self, name, params, body): self.name, self.params, self.body = name, params, body
class FunctionCallNode(ASTNode):
    def __init__(self, callee, args): self.callee, self.args = callee, args
class ReturnNode(ASTNode):
    def __init__(self, expr): self.expr = expr
class InputNode(ASTNode):
    def __init__(self, prompt_expr): self.prompt_expr = prompt_expr
class ArrayLiteralNode(ASTNode):
    def __init__(self, elements): self.elements = elements
class IndexAccessNode(ASTNode):
    def __init__(self, target, index): self.target, self.index = target, index
class TryCatchNode(ASTNode):
    def __init__(self, try_block, error_var, catch_block):
        self.try_block, self.error_var, self.catch_block = try_block, error_var, catch_block
class BinaryOpNode(ASTNode):
    def __init__(self, left, op, right): self.left, self.op, self.right = left, op, right
class UnaryOpNode(ASTNode):
    def __init__(self, op, operand): self.op, self.operand = op, operand
class LiteralNode(ASTNode):
    def __init__(self, value): self.value = value
class VariableNode(ASTNode):
    def __init__(self, name): self.name = name
class HaltNode(ASTNode): pass

class Parser:
    def __init__(self, tokens): self.tokens, self.pos = tokens, 0
    def current(self): return self.tokens[self.pos]
    def match(self, *types):
        if self.current().type in types:
            tok = self.current(); self.pos += 1; return tok
        return None
    def expect(self, token_type):
        tok = self.match(token_type)
        if not tok: raise SyntaxError(f"Expected {token_type.name} at line {self.current().line}")
        return tok
    def parse(self):
        stmts = []
        while self.current().type != TokenType.EOF: stmts.append(self.parse_statement())
        return ProgramNode(stmts)
    def parse_statement(self):
        if self.match(TokenType.ACCIO):
            name = self.expect(TokenType.IDENTIFIER).value
            self.expect(TokenType.ASSIGN)
            return VarDeclNode(name, self.parse_expression())
        if self.match(TokenType.LUMOS): return PrintNode(self.parse_expression())
        if self.match(TokenType.EXPECTOPATRONUM): return ReturnNode(self.parse_expression())
        if self.match(TokenType.AVADAKEDAVRA): return HaltNode()
        if self.match(TokenType.INCANTATION):
            name = self.expect(TokenType.IDENTIFIER).value
            self.expect(TokenType.LPAREN)
            params = []
            if self.current().type != TokenType.RPAREN:
                params.append(self.expect(TokenType.IDENTIFIER).value)
                while self.match(TokenType.COMMA): params.append(self.expect(TokenType.IDENTIFIER).value)
            self.expect(TokenType.RPAREN)
            return FunctionDefNode(name, params, self.parse_block())
        if self.match(TokenType.RIDDIKULUS):
            self.expect(TokenType.LPAREN)
            c = self.parse_expression()
            self.expect(TokenType.RPAREN)
            t = self.parse_block()
            e = self.parse_block() if self.match(TokenType.FINITE) else None
            return IfNode(c, t, e)
        if self.match(TokenType.TIMETURNER):
            self.expect(TokenType.LPAREN)
            c = self.parse_expression()
            self.expect(TokenType.RPAREN)
            return WhileNode(c, self.parse_block())
        if self.match(TokenType.PROTEGO):
            tb = self.parse_block()
            self.expect(TokenType.CRUCIO)
            self.expect(TokenType.LPAREN)
            err = self.expect(TokenType.IDENTIFIER).value
            self.expect(TokenType.RPAREN)
            return TryCatchNode(tb, err, self.parse_block())
        expr = self.parse_expression()
        if isinstance(expr, VariableNode) and self.match(TokenType.ASSIGN):
            return VarAssignNode(expr.name, self.parse_expression())
        if isinstance(expr, IndexAccessNode) and self.match(TokenType.ASSIGN):
            return IndexAssignNode(expr.target, expr.index, self.parse_expression())
        return expr
    def parse_block(self):
        self.expect(TokenType.LBRACE)
        stmts = []
        while self.current().type not in (TokenType.RBRACE, TokenType.EOF):
            stmts.append(self.parse_statement())
        self.expect(TokenType.RBRACE)
        return BlockNode(stmts)
    def parse_expression(self): return self.parse_or()
    def parse_or(self):
        n = self.parse_and()
        while self.match(TokenType.OR): n = BinaryOpNode(n, TokenType.OR, self.parse_and())
        return n
    def parse_and(self):
        n = self.parse_comp()
        while self.match(TokenType.AND): n = BinaryOpNode(n, TokenType.AND, self.parse_comp())
        return n
    def parse_comp(self):
        n = self.parse_term()
        while True:
            op = self.match(TokenType.EQ, TokenType.NEQ, TokenType.GT, TokenType.LT, TokenType.GTE, TokenType.LTE)
            if not op: break
            n = BinaryOpNode(n, op.type, self.parse_term())
        return n
    def parse_term(self):
        n = self.parse_factor()
        while True:
            op = self.match(TokenType.PLUS, TokenType.MINUS)
            if not op: break
            n = BinaryOpNode(n, op.type, self.parse_factor())
        return n
    def parse_factor(self):
        n = self.parse_unary()
        while True:
            op = self.match(TokenType.STAR, TokenType.SLASH, TokenType.PERCENT)
            if not op: break
            n = BinaryOpNode(n, op.type, self.parse_unary())
        return n
    def parse_unary(self):
        if op := self.match(TokenType.NOT, TokenType.MINUS): return UnaryOpNode(op.type, self.parse_unary())
        return self.parse_postfix()
    def parse_postfix(self):
        n = self.parse_prim()
        while True:
            if self.match(TokenType.LBRACKET):
                idx = self.parse_expression()
                self.expect(TokenType.RBRACKET)
                n = IndexAccessNode(n, idx)
            elif self.match(TokenType.LPAREN):
                args = []
                if self.current().type != TokenType.RPAREN:
                    args.append(self.parse_expression())
                    while self.match(TokenType.COMMA): args.append(self.parse_expression())
                self.expect(TokenType.RPAREN)
                n = FunctionCallNode(n, args)
            else: break
        return n
    def parse_prim(self):
        if tok := self.match(TokenType.NUMBER, TokenType.STRING, TokenType.BOOLEAN): return LiteralNode(tok.value)
        if self.match(TokenType.LEGILIMENS):
            self.expect(TokenType.LPAREN)
            p = self.parse_expression() if self.current().type != TokenType.RPAREN else LiteralNode("")
            self.expect(TokenType.RPAREN)
            return InputNode(p)
        if self.match(TokenType.LBRACKET):
            elems = []
            if self.current().type != TokenType.RBRACKET:
                elems.append(self.parse_expression())
                while self.match(TokenType.COMMA): elems.append(self.parse_expression())
            self.expect(TokenType.RBRACKET)
            return ArrayLiteralNode(elems)
        if tok := self.match(TokenType.IDENTIFIER): return VariableNode(tok.value)
        if self.match(TokenType.LPAREN):
            n = self.parse_expression()
            self.expect(TokenType.RPAREN)
            return n
        raise SyntaxError(f"Unexpected token '{self.current().value}' at line {self.current().line}")

class Environment:
    def __init__(self, parent=None):
        self.values, self.parent = {}, parent
    def define(self, name, val):
        c = self
        while c:
            if name in c.values: c.values[name] = val; return
            c = c.parent
        self.values[name] = val
    def assign(self, name, val):
        if name in self.values: self.values[name] = val; return
        if self.parent: self.parent.assign(name, val); return
        raise NameError(f"Undefined variable '{name}'")
    def get(self, name):
        if name in self.values: return self.values[name]
        if self.parent: return self.parent.get(name)
        raise NameError(f"Undefined variable '{name}'")

class ReturnTrigger(Exception):
    def __init__(self, val): self.val = val

class BuiltinFunction:
    def __init__(self, name, fn): self.name, self.fn = name, fn
    async def call(self, interp, args): return self.fn(*args)

class PotterFunction:
    def __init__(self, name, params, body, env):
        self.name, self.params, self.body, self.env = name, params, body, env
    async def call(self, interp, args):
        if len(args) != len(self.params): raise TypeError(f"'{self.name}' expected {len(self.params)} args")
        lenv = Environment(parent=self.env)
        for p, a in zip(self.params, args): lenv.values[p] = a
        try: return await interp.eval(self.body, lenv)
        except ReturnTrigger as r: return r.val

class AsyncInterpreter:
    def __init__(self, print_fn, input_fn):
        self.print_fn = print_fn
        self.input_fn = input_fn

    async def eval(self, n, env):
        if isinstance(n, ProgramNode):
            r = None
            for s in n.statements: r = await self.eval(s, env)
            return r
        if isinstance(n, LiteralNode): return n.value
        if isinstance(n, VariableNode): return env.get(n.name)
        if isinstance(n, VarDeclNode):
            v = await self.eval(n.expr, env)
            env.define(n.name, v)
            return v
        if isinstance(n, VarAssignNode):
            v = await self.eval(n.expr, env)
            env.assign(n.name, v)
            return v
        if isinstance(n, IndexAssignNode):
            t = await self.eval(n.target, env)
            idx = await self.eval(n.index, env)
            v = await self.eval(n.expr, env)
            t[int(idx)] = v
            return v
        if isinstance(n, PrintNode):
            val = await self.eval(n.expr, env)
            self.print_fn(str(val))
            return None
        if isinstance(n, InputNode):
            p = str(await self.eval(n.prompt_expr, env))
            # Awaits the JS input promise without blocking the UI thread
            raw = str(await self.input_fn(p)).strip()
            try: return float(raw) if '.' in raw else int(raw)
            except ValueError: return raw
        if isinstance(n, ArrayLiteralNode):
            return [await self.eval(e, env) for e in n.elements]
        if isinstance(n, IndexAccessNode):
            t = await self.eval(n.target, env)
            idx = await self.eval(n.index, env)
            return t[int(idx)]
        if isinstance(n, FunctionDefNode):
            fn = PotterFunction(n.name, n.params, n.body, env)
            env.define(n.name, fn)
            return fn
        if isinstance(n, FunctionCallNode):
            callee = await self.eval(n.callee, env) if isinstance(n.callee, ASTNode) else env.get(n.callee)
            args = [await self.eval(a, env) for a in n.args]
            return await callee.call(self, args)
        if isinstance(n, ReturnNode): raise ReturnTrigger(await self.eval(n.expr, env))
        if isinstance(n, HaltNode): sys.exit(0)
        if isinstance(n, BlockNode):
            cenv = Environment(parent=env)
            r = None
            for s in n.statements: r = await self.eval(s, cenv)
            return r
        if isinstance(n, IfNode):
            if await self.eval(n.condition, env): return await self.eval(n.then_branch, env)
            elif n.else_branch: return await self.eval(n.else_branch, env)
            return None
        if isinstance(n, WhileNode):
            while await self.eval(n.condition, env): await self.eval(n.body, env)
            return None
        if isinstance(n, TryCatchNode):
            try: return await self.eval(n.try_block, env)
            except Exception as ex:
                cenv = Environment(parent=env)
                cenv.define(n.error_var, str(ex))
                return await self.eval(n.catch_block, cenv)
        if isinstance(n, UnaryOpNode):
            v = await self.eval(n.operand, env)
            return not v if n.op == TokenType.NOT else -v
        if isinstance(n, BinaryOpNode):
            l = await self.eval(n.left, env)
            if n.op == TokenType.AND: return l and await self.eval(n.right, env)
            if n.op == TokenType.OR: return l or await self.eval(n.right, env)
            r = await self.eval(n.right, env)
            if n.op == TokenType.PLUS:
                if isinstance(l, str) or isinstance(r, str): return str(l) + str(r)
                return l + r
            if n.op == TokenType.MINUS: return l - r
            if n.op == TokenType.STAR: return l * r
            if n.op == TokenType.SLASH: return l / r
            if n.op == TokenType.PERCENT: return l % r
            if n.op == TokenType.GT: return l > r
            if n.op == TokenType.LT: return l < r
            if n.op == TokenType.GTE: return l >= r
            if n.op == TokenType.LTE: return l <= r
            if n.op == TokenType.EQ: return l == r
            if n.op == TokenType.NEQ: return l != r
        raise RuntimeError(f"Unhandled node: {type(n).__name__}")
`);

        document.getElementById("statusIndicator").innerText = "Ready";
        document.getElementById("statusIndicator").style.color = "#10b981";
        document.getElementById("terminal").innerText = "Engine ready.\nClick 'Run' to execute in the terminal.\n";
        document.getElementById("runBtn").disabled = false;
      } catch (err) {
        document.getElementById("terminal").innerText = "Init Error: " + err;
        document.getElementById("statusIndicator").innerText = "Failed";
        document.getElementById("statusIndicator").style.color = "#ef4444";
      }
    }

    initPyodideEngine();

    function appendTerminal(text) {
      const term = document.getElementById("terminal");
      const span = document.createElement("span");
      span.innerText = text + "\n";
      term.appendChild(span);
      term.scrollTop = term.scrollHeight;
    }

    // Terminal Input Promise resolver
    function promptUser(promptText) {
      return new Promise((resolve) => {
        const term = document.getElementById("terminal");
        const line = document.createElement("div");
        line.className = "active-prompt-line";

        const promptSpan = document.createElement("span");
        promptSpan.className = "prompt-text";
        promptSpan.innerText = promptText;

        const input = document.createElement("input");
        input.className = "term-input";
        input.type = "text";
        input.autofocus = true;

        line.appendChild(promptSpan);
        line.appendChild(input);
        term.appendChild(line);
        term.scrollTop = term.scrollHeight;
        input.focus();

        input.addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            const val = input.value;
            line.innerHTML = `<span class="prompt-text">${promptText}</span><span style="color:#facc15; margin-left:6px;">${val}</span>`;
            resolve(val);
          }
        });
      });
    }

    function focusInput() {
      const active = document.querySelector(".term-input");
      if (active) active.focus();
    }

    async function executeCode() {
      if (!pyodideInstance) return;
      document.getElementById("runBtn").disabled = true;
      const term = document.getElementById("terminal");
      term.innerHTML = "";

      // Bind JS functions to Python namespace
      window.jsPrint = (msg) => appendTerminal(msg);
      window.jsInput = async (prompt) => await promptUser(prompt);

      const code = editorInstance.getValue();
      const runner = `
import asyncio
import js

source = """${code.replace(/\\/g, '\\\\').replace(/"""/g, '\\"\\"\\"') }"""

async def run_async():
    try:
        tokens = Lexer(source).tokenize()
        ast = Parser(tokens).parse()
        env = Environment()
        env.define("len", BuiltinFunction("len", lambda a: len(a)))
        env.define("push", BuiltinFunction("push", lambda a, v: a.append(v) or a))
        env.define("pop", BuiltinFunction("pop", lambda a: a.pop()))
        env.define("floor", BuiltinFunction("floor", lambda n: math.floor(n)))
        interp = AsyncInterpreter(js.jsPrint, js.jsInput)
        await interp.eval(ast, env)
    except Exception as ex:
        js.jsPrint(f"Runtime Error: {ex}")

asyncio.ensure_future(run_async())
`;
      try {
        await pyodideInstance.runPythonAsync(runner);
      } catch (err) {
        appendTerminal("System Error: " + err);
      } finally {
        document.getElementById("runBtn").disabled = false;
      }
    }

    function clearTerminal() {
      document.getElementById("terminal").innerHTML = "";
    }

    function loadTemplate(key) {
      if (templates[key]) {
        editorInstance.setValue(templates[key]);
      }
    }
  </script>
</body>
</html>
